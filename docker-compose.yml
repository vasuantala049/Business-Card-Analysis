version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: card-analyzer-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: cardanalyzer

  backend:
    build: ./backend
    container_name: card-analyzer-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=${SPRING_DATA_MONGODB_URI}
      - SPRING_DATA_MONGODB_DATABASE=${SPRING_DATA_MONGODB_DATABASE:-cardanalyzer}
      - QWEN_BASE_URL=${QWEN_BASE_URL:-http://host.docker.internal:50305/v1}
      - QWEN_MODEL=${QWEN_MODEL:-qwen3-vl}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in your environment or .env}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in your environment or .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: card-analyzer-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api

volumes:
  mongo_data:
